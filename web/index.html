    <style>
        :root {
          --background: #f1f5f9;
          --surface: rgba(255, 255, 255, 0.78);
          --surface-border: rgba(148, 163, 184, 0.22);

          --primary: #9f1239;
          --primary-dark: #881337;
          --primary-soft: rgba(159, 18, 57, 0.12);

          --text-primary: #0f172a;
          --text-secondary: #475569;
          --text-muted: #94a3b8;

          --grid-color: rgba(71, 85, 105, 0.055);
        }

        * {
          box-sizing: border-box;
        }

        html,
        body {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: var(--background);
          font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Arial,
            sans-serif;
        }

        body {
          position: relative;
        }

        #splash-container {
          position: fixed;
          inset: 0;
          z-index: 999999;

          display: flex;
          align-items: center;
          justify-content: center;

          overflow: hidden;
          background:
            radial-gradient(
              circle at 50% 45%,
              rgba(255, 255, 255, 0.96) 0%,
              rgba(241, 245, 249, 0.96) 48%,
              #e7edf4 100%
            );

          opacity: 1;
          visibility: visible;

          transition:
            opacity 0.65s ease,
            visibility 0.65s ease;
        }

        #splash-container.hide {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }

        /* Fondo cuadriculado empresarial */
        .digital-grid {
          position: absolute;
          inset: -50%;

          background-image:
            linear-gradient(
              to right,
              var(--grid-color) 1px,
              transparent 1px
            ),
            linear-gradient(
              to bottom,
              var(--grid-color) 1px,
              transparent 1px
            );

          background-size: 46px 46px;

          transform:
            perspective(700px)
            rotateX(58deg)
            translateY(24%);

          transform-origin: center center;

          animation: gridMovement 8s linear infinite;
        }

        @keyframes gridMovement {
          from {
            background-position: 0 0;
          }

          to {
            background-position: 0 92px;
          }
        }

        /* Brillos decorativos */
        .ambient-light {
          position: absolute;
          border-radius: 50%;
          filter: blur(90px);
          pointer-events: none;
        }

        .ambient-light-one {
          width: 420px;
          height: 420px;
          top: -180px;
          right: -100px;
          background: rgba(159, 18, 57, 0.13);
          animation: ambientFloatOne 7s ease-in-out infinite alternate;
        }

        .ambient-light-two {
          width: 360px;
          height: 360px;
          bottom: -180px;
          left: -100px;
          background: rgba(71, 85, 105, 0.13);
          animation: ambientFloatTwo 8s ease-in-out infinite alternate;
        }

        @keyframes ambientFloatOne {
          from {
            transform: translate(0, 0) scale(1);
          }

          to {
            transform: translate(-55px, 60px) scale(1.15);
          }
        }

        @keyframes ambientFloatTwo {
          from {
            transform: translate(0, 0) scale(1);
          }

          to {
            transform: translate(70px, -45px) scale(1.12);
          }
        }

        /* Contenido principal */
        .splash-content {
          position: relative;
          z-index: 5;

          width: min(90%, 560px);

          display: flex;
          flex-direction: column;
          align-items: center;

          text-align: center;
        }

        /* Símbolo de Komanda */
        .brand-symbol-container {
          position: relative;

          width: 108px;
          height: 108px;

          display: flex;
          align-items: center;
          justify-content: center;

          margin-bottom: 28px;
        }

        .symbol-glow {
          position: absolute;
          inset: 5px;

          border-radius: 30px;

          background: var(--primary-soft);
          filter: blur(18px);

          animation: symbolGlow 2.2s ease-in-out infinite;
        }

        @keyframes symbolGlow {
          0%,
          100% {
            opacity: 0.45;
            transform: scale(0.92);
          }

          50% {
            opacity: 1;
            transform: scale(1.12);
          }
        }

        .brand-symbol {
          position: relative;

          width: 88px;
          height: 88px;

          display: flex;
          align-items: center;
          justify-content: center;

          border: 1px solid rgba(159, 18, 57, 0.18);
          border-radius: 26px;

          background:
            linear-gradient(
              145deg,
              rgba(255, 255, 255, 0.98),
              rgba(241, 245, 249, 0.86)
            );

          box-shadow:
            0 24px 55px rgba(15, 23, 42, 0.13),
            inset 0 1px 0 rgba(255, 255, 255, 0.9);

          animation: symbolEntry 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes symbolEntry {
          from {
            opacity: 0;
            transform: translateY(25px) scale(0.75) rotate(-10deg);
          }

          to {
            opacity: 1;
            transform: translateY(0) scale(1) rotate(0);
          }
        }

        .symbol-letter {
          position: relative;

          font-size: 42px;
          line-height: 1;
          font-weight: 900;
          letter-spacing: -4px;

          color: var(--primary);
        }

        .symbol-letter::after {
          content: "";

          position: absolute;
          left: 3px;
          bottom: -9px;

          width: 29px;
          height: 4px;

          border-radius: 999px;
          background: var(--primary);

          transform-origin: left center;
          animation: lineGrow 1s 0.5s ease both;
        }

        @keyframes lineGrow {
          from {
            transform: scaleX(0);
          }

          to {
            transform: scaleX(1);
          }
        }

        /* Marca principal */
        .product-name {
          margin: 0;

          font-size: clamp(38px, 7vw, 58px);
          line-height: 1;
          font-weight: 800;
          letter-spacing: 12px;

          color: var(--text-primary);

          transform: translateX(6px);

          animation: productReveal 1s 0.25s ease both;
        }

        @keyframes productReveal {
          from {
            opacity: 0;
            letter-spacing: 22px;
            filter: blur(7px);
            transform: translateX(6px) translateY(15px);
          }

          to {
            opacity: 1;
            letter-spacing: 12px;
            filter: blur(0);
            transform: translateX(6px) translateY(0);
          }
        }

        .product-category {
          margin-top: 14px;

          font-size: 11px;
          font-weight: 700;
          letter-spacing: 4px;
          text-transform: uppercase;

          color: var(--text-secondary);

          animation: fadeUp 0.8s 0.75s ease both;
        }

        /* Línea animada */
        .brand-divider {
          position: relative;

          width: min(80%, 360px);
          height: 1px;

          margin: 35px 0 27px;

          overflow: hidden;
          background: rgba(148, 163, 184, 0.24);

          animation: fadeUp 0.8s 0.9s ease both;
        }

        .brand-divider::after {
          content: "";

          position: absolute;
          top: 0;
          left: -45%;

          width: 45%;
          height: 100%;

          background:
            linear-gradient(
              90deg,
              transparent,
              var(--primary),
              transparent
            );

          animation: dividerScan 1.75s ease-in-out infinite;
        }

        @keyframes dividerScan {
          0% {
            left: -45%;
          }

          100% {
            left: 100%;
          }
        }

        /* Estado de carga */
        .loading-section {
          width: min(78%, 330px);
          animation: fadeUp 0.8s 1s ease both;
        }

        .loading-header {
          display: flex;
          align-items: center;
          justify-content: space-between;

          margin-bottom: 10px;
        }

        .loading-label {
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 1.5px;
          text-transform: uppercase;

          color: var(--text-secondary);
        }

        .loading-status {
          display: inline-flex;
          align-items: center;
          gap: 7px;

          font-size: 11px;
          font-weight: 600;

          color: var(--primary);
        }

        .status-dot {
          width: 7px;
          height: 7px;

          border-radius: 50%;
          background: var(--primary);

          box-shadow: 0 0 0 0 rgba(159, 18, 57, 0.35);

          animation: statusPulse 1.5s infinite;
        }

        @keyframes statusPulse {
          0% {
            box-shadow: 0 0 0 0 rgba(159, 18, 57, 0.38);
          }

          70% {
            box-shadow: 0 0 0 9px rgba(159, 18, 57, 0);
          }

          100% {
            box-shadow: 0 0 0 0 rgba(159, 18, 57, 0);
          }
        }

        .loading-track {
          position: relative;

          width: 100%;
          height: 4px;

          overflow: hidden;
          border-radius: 999px;

          background: rgba(148, 163, 184, 0.2);
        }

        .loading-bar {
          position: absolute;
          inset: 0 auto 0 0;

          width: 36%;
          border-radius: inherit;

          background:
            linear-gradient(
              90deg,
              var(--primary-dark),
              var(--primary),
              #be123c
            );

          box-shadow: 0 0 15px rgba(159, 18, 57, 0.35);

          animation: loadingMovement 1.45s ease-in-out infinite;
        }

        @keyframes loadingMovement {
          0% {
            left: -38%;
            width: 30%;
          }

          50% {
            width: 48%;
          }

          100% {
            left: 108%;
            width: 30%;
          }
        }

        /* Firma de Grolar Studios */
        .grolar-signature {
          position: absolute;
          z-index: 5;

          left: 50%;
          bottom: 42px;

          width: max-content;
          max-width: calc(100% - 40px);

          display: flex;
          flex-direction: column;
          align-items: center;

          transform: translateX(-50%);

          animation: signatureEntry 0.9s 1.2s ease both;
        }

        @keyframes signatureEntry {
          from {
            opacity: 0;
            transform: translateX(-50%) translateY(16px);
          }

          to {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
          }
        }

        .signature-label {
          margin-bottom: 7px;

          font-size: 9px;
          font-weight: 700;
          letter-spacing: 3px;
          text-transform: uppercase;

          color: var(--text-muted);
        }

        .signature-name {
          display: flex;
          align-items: center;
          gap: 10px;

          color: var(--text-primary);
        }

        .signature-mark {
          width: 7px;
          height: 7px;

          border-radius: 2px;
          background: var(--primary);

          transform: rotate(45deg);
        }

        .signature-name strong {
          font-size: 14px;
          font-weight: 800;
          letter-spacing: 3.5px;
        }

        .signature-subtitle {
          margin-top: 7px;

          font-size: 9px;
          font-weight: 600;
          letter-spacing: 1.4px;
          text-transform: uppercase;

          color: var(--text-secondary);
        }

        @keyframes fadeUp {
          from {
            opacity: 0;
            transform: translateY(14px);
          }

          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        /* Ajustes móviles */
        @media (max-width: 600px) {
          .brand-symbol-container {
            width: 94px;
            height: 94px;
            margin-bottom: 23px;
          }

          .brand-symbol {
            width: 78px;
            height: 78px;
            border-radius: 23px;
          }

          .symbol-letter {
            font-size: 37px;
          }

          .product-name {
            font-size: 37px;
            letter-spacing: 7px;
            transform: translateX(3.5px);
          }

          @keyframes productReveal {
            from {
              opacity: 0;
              letter-spacing: 15px;
              filter: blur(7px);
              transform: translateX(3.5px) translateY(15px);
            }

            to {
              opacity: 1;
              letter-spacing: 7px;
              filter: blur(0);
              transform: translateX(3.5px) translateY(0);
            }
          }

          .product-category {
            font-size: 9px;
            letter-spacing: 2.5px;
          }

          .brand-divider {
            margin-top: 28px;
            margin-bottom: 24px;
          }

          .grolar-signature {
            bottom: 28px;
          }

          .signature-name strong {
            font-size: 12px;
            letter-spacing: 2.5px;
          }

          .signature-subtitle {
            font-size: 8px;
          }
        }

        @media (max-height: 620px) {
          .splash-content {
            transform: scale(0.82);
          }

          .grolar-signature {
            bottom: 18px;
          }
        }

        /* Reduce animaciones cuando el sistema lo solicita */
        @media (prefers-reduced-motion: reduce) {
          *,
          *::before,
          *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
          }
        }
    </style>
</head>

<body>
<div id="splash-container">
    <div class="digital-grid"></div>

    <div class="ambient-light ambient-light-one"></div>
    <div class="ambient-light ambient-light-two"></div>

    <main class="splash-content">
        <div class="brand-symbol-container">
            <div class="symbol-glow"></div>

            <div class="brand-symbol">
                <span class="symbol-letter">K</span>
            </div>
        </div>

        <h1 class="product-name">KOMANDA</h1>

        <div class="product-category">
            Restaurant Management Platform
        </div>

        <div class="brand-divider"></div>

        <section class="loading-section">
            <div class="loading-header">
          <span class="loading-label">
            Iniciando plataforma
          </span>

                <span class="loading-status">
            <span class="status-dot"></span>
            Sistema seguro
          </span>
            </div>

            <div class="loading-track">
                <div class="loading-bar"></div>
            </div>
        </section>
    </main>

    <footer class="grolar-signature">
        <div class="signature-label">
            Un producto desarrollado por
        </div>

        <div class="signature-name">
            <span class="signature-mark"></span>
            <strong>GROLAR STUDIOS</strong>
            <span class="signature-mark"></span>
        </div>

        <div class="signature-subtitle">
            Enterprise Software Solutions
        </div>
    </footer>
</div>

<script>
    const splash = document.getElementById("splash-container");

    let flutterStarted = false;

    function hideSplash() {
      if (flutterStarted || !splash) {
        return;
      }

      flutterStarted = true;
      splash.classList.add("hide");

      window.setTimeout(() => {
        splash.remove();
        document.body.style.overflow = "auto";
      }, 700);
    }

    window.addEventListener("flutter-first-frame", hideSplash);

    /*
     * Protección opcional:
     * si el evento flutter-first-frame no se ejecuta por alguna razón,
     * el splash se ocultará después de 15 segundos.
     */
    window.setTimeout(() => {
      if (document.querySelector("flutter-view")) {
        hideSplash();
      }
    }, 15000);
</script>

<script src="flutter_bootstrap.js" async></script>
</body>

plugins {
    id "com.android.application"
    id "kotlin-android"
    // ✅ Plugin de Google Services (necesario para Firebase)
    id "com.google.gms.google-services"
    // ⚠️ El plugin de Flutter debe ir al final
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.trendy_vibe"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.trendy_vibe"
        minSdkVersion = flutter.minSdkVersion // ✅ Requerido por Firebase Messaging
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true // ✅ Recomendado por si el proyecto crece
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // ✅ Dependencias para Firebase y notificaciones
    implementation platform('com.google.firebase:firebase-bom:33.2.0') // Administra versiones automáticamente
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.1'
}
